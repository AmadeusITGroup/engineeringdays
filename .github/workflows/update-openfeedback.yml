name: Update OpenFeedback JSON

on:
  push:
    paths:
      - 'engineering-days-2026_sessions.json'
    branches:
      - main
      - master
  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  update-openfeedback:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate openfeedback.json
        run: python generate_openfeedback.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet openfeedback.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add openfeedback.json
          git commit -m "Auto-update openfeedback.json from sessions data"
          git push
